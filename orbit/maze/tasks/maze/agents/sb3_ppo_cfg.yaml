# Reference: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml#L32
seed: 42
n_timesteps: !!float 1.5e8
policy: 'MultiInputPolicy'
n_steps: 16

# batch_size: 4096
# n_epochs: 20
# learning_rate: !!float 3e-4

# less overfitting and better data use
batch_size: 16384
n_epochs: 5
learning_rate: lin_3.0e-4

gae_lambda: 0.95
gamma: 0.99
clip_range: !!float 0.2
# TODO ROV current default
# ent_coef: 0.01
# vf_coef: 1.0
# TODO ROV was a bit better
ent_coef: 0.02
vf_coef: 0.5
max_grad_norm: 1.0